<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' | escape }}" data-appearance="{{ site.theme_config.appearance | default: 'auto' | escape }}">
  {%- include head.html -%}
  <body class="site-body site-body--embed" data-embed-page>
    {%- include icon-sprite.html -%}
    <main class="embed-root" aria-label="Embedded content">
      {{ content }}
    </main>
    <script type="module" src="{{ '/assets/js/embed.js' | relative_url }}"></script>
  </body>
</html>
